<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#24783f">
  <title>RAVELPHONE Rapportini HDD v5</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css?v=5">
</head>
<body>
<header class="brand"><h1>RAVELPHONE</h1><div>Rapportini HDD · v5</div></header>

<main id="home" class="screen">
  <button class="primary big" id="newBtn">+ Nuovo rapportino</button>
  <button class="secondary big" id="historyBtn">Storico rapportini</button>
  <section class="card"><h2>Rapportino rapido da cantiere</h2><p>Compila dati, perforazione, note, fino a 8 foto e firma. Poi crea/salva il PDF o condividi.</p></section>
</main>

<main id="form" class="screen hidden">
  <button class="back" data-home>← Home</button>
  <h2>Nuovo rapportino</h2>
  <label>Data<input id="date" type="date"></label>
  <label>Cantiere<input id="site" autocomplete="off"></label>
  <h3>PERFORAZIONE HDD</h3>
  <label>Fase<select id="phase"><option>Perforazione pilota</option><option>Alesatura</option><option>Tiro tubazione</option><option>Altro</option></select></label>
  <label>Metri eseguiti<input id="meters" inputmode="decimal" type="number" step="0.1"></label>
  <label>Descrizione lavori<textarea id="work" rows="4"></textarea></label>
  <label>Note / imprevisti<textarea id="notes" rows="4"></textarea></label>

  <h3>Foto <small id="photoCount">0 / 8</small></h3>
  <label class="photoPicker">+ Aggiungi foto
    <input id="photos" type="file" accept="image/*" multiple>
  </label>
  <div id="photoGrid" class="photo-grid"></div>

  <h3>Firma</h3>
  <label>Nome firmatario<input id="signer"></label>
  <canvas id="signature" width="700" height="260"></canvas>
  <button class="secondary" id="clearSign">Cancella firma</button>
  <button class="primary big" id="previewBtn">Anteprima rapportino</button>
</main>

<main id="preview" class="screen hidden">
  <div class="actions no-print">
    <button class="secondary" id="editBtn">← Modifica</button>
    <button class="primary" id="pdfBtn">Crea / salva PDF</button>
    <button class="secondary" id="shareBtn">Condividi</button>
  </div>
  <article id="report" class="report"></article>
</main>

<main id="history" class="screen hidden">
  <button class="back" data-home>← Home</button><h2>Storico rapportini</h2>
  <div id="historyList"></div>
</main>

<script src="app.js?v=5"></script>
</body></html>
