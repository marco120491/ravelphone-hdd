<!doctype html><html lang='it'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><meta name='theme-color' content='#17733b'><meta name='apple-mobile-web-app-capable' content='yes'><meta name='apple-mobile-web-app-status-bar-style' content='default'><meta name='apple-mobile-web-app-title' content='RAVELPHONE HDD'><link rel='apple-touch-icon' href='icon-192.png'><link rel='manifest' href='manifest.webmanifest'><link rel='stylesheet' href='style.css'><title>RAVELPHONE HDD</title></head><body>
<header><div class='brand'>RAVELPHONE</div><div class='sub'>Rapportini HDD</div></header>
<main>
<section id='home' class='page active'><button class='primary big' onclick='newReport()'>＋ Nuovo rapportino</button><button class='secondary big' onclick="show('history')">Storico rapportini</button><div class='card'><b>Rapportino rapido da cantiere</b><p>Compila dati, perforazione, note, foto e firma. Poi stampa/salva in PDF o condividi.</p></div></section>
<section id='form' class='page'><h2>Nuovo rapportino</h2><form id='reportForm'>
<h3>Dati cantiere</h3><label>Data<input id='date' type='date' required></label><label>Cantiere / località<input id='site' required></label><label>Cliente<input id='client'></label><label>Commessa<input id='job'></label><label>Operatore<input id='operator'></label><label>Strumentista<input id='instrument'></label>
<h3>Perforazione HDD</h3><label>Perforatore<input id='rig'></label><label>Diametro tubo<input id='diameter'></label><label>Lunghezza prevista (m)<input id='planned' inputmode='decimal' type='number' step='0.1'></label><label>Metri eseguiti oggi<input id='meters' inputmode='decimal' type='number' step='0.1'></label><label>Fase<select id='phase'><option>Perforazione pilota</option><option>Alesatura</option><option>Tiro tubo</option><option>Scavo / preparazione</option><option>Ripristino</option><option>Altro</option></select></label>
<h3>Lavorazioni e note</h3><label>Lavorazioni eseguite<textarea id='work' rows='4'></textarea></label><label>Note / imprevisti<textarea id='notes' rows='5'></textarea></label>
<h3>Foto</h3><label class='photoBtn'>📷 Aggiungi foto<input id='photos' type='file' accept='image/*' capture='environment' multiple></label><div id='photoPreview' class='photos'></div>
<h3>Firma</h3><label>Nome firmatario<input id='signer'></label><canvas id='signature' width='700' height='240'></canvas><div class='row'><button type='button' class='secondary' onclick='clearSig()'>Cancella firma</button></div>
<div class='sticky'><button type='button' class='primary' onclick='previewReport()'>Anteprima rapportino</button></div></form></section>
<section id='preview' class='page'><div class='row noPrint'><button class='secondary' onclick="show('form')">← Modifica</button><button class='primary' onclick='saveAndPrint()'>Crea / salva PDF</button><button class='secondary' onclick='shareReport()'>Condividi</button></div><article id='paper'></article></section>
<section id='history' class='page'><div class='row'><button class='secondary' onclick="show('home')">← Home</button><button class='primary' onclick='newReport()'>＋ Nuovo</button></div><h2>Storico rapportini</h2><div id='historyList'></div></section>
</main><script src='app.js'></script></body></html>
